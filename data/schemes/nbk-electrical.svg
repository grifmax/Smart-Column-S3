<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#edf4f9"/>
      <stop offset="100%" stop-color="#d8e6f0"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f8fb"/>
    </linearGradient>
    <linearGradient id="controller" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d3d56"/>
      <stop offset="100%" stop-color="#132b3f"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#35546d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-ac" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c8563f"/>
    </marker>
    <marker id="arrow-12v" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f9d62"/>
    </marker>
    <marker id="arrow-5v" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b7dd3"/>
    </marker>
    <marker id="arrow-sig" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d55c7"/>
    </marker>
  </defs>

  <style>
    text {
      font-family: 'Manrope', 'Segoe UI', sans-serif;
      fill: #183043;
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-size: 12px;
      font-weight: 600;
      fill: #5e788d;
    }
    .panel {
      fill: url(#card);
      stroke: #c5d6e2;
      stroke-width: 1.5;
      filter: url(#shadow);
    }
    .panel-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.7px;
      fill: #35536a;
      text-transform: uppercase;
    }
    .box {
      fill: #ffffff;
      stroke: #aebfce;
      stroke-width: 1.3;
      rx: 16;
      ry: 16;
    }
    .soft {
      fill: #f4f8fb;
      stroke: #c3d3df;
      stroke-width: 1.1;
    }
    .chip {
      fill: #f7fbff;
      stroke: #bad0e0;
      stroke-width: 1;
      rx: 10;
      ry: 10;
    }
    .chip-dark {
      fill: rgba(255,255,255,0.08);
      stroke: rgba(226,240,250,0.18);
      stroke-width: 1;
    }
    .controller-box {
      fill: url(#controller);
      stroke: #0f2434;
      stroke-width: 1.6;
      filter: url(#shadow);
    }
    .controller-text {
      fill: #eff7fd;
    }
    .pin {
      fill: #f7fbff;
      stroke: #bcd0dd;
      stroke-width: 1;
    }
    .pin-text {
      font-size: 10px;
      font-weight: 700;
      fill: #214058;
    }
    .label {
      font-size: 12px;
      font-weight: 700;
      fill: #29465d;
    }
    .small {
      font-size: 10px;
      font-weight: 600;
      fill: #5f788c;
    }
    .tiny {
      font-size: 9px;
      font-weight: 600;
      fill: #6d8496;
    }
    .rail-text {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .wire-ac {
      fill: none;
      stroke: #c8563f;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire-12v {
      fill: none;
      stroke: #1f9d62;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire-5v {
      fill: none;
      stroke: #2b7dd3;
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire-3v3 {
      fill: none;
      stroke: #0d9aa3;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire-sig {
      fill: none;
      stroke: #7d55c7;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .wire-bus {
      fill: none;
      stroke: #d28a19;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 7 5;
    }
    .wire-gnd {
      fill: none;
      stroke: #6c7784;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .connector {
      fill: #ffffff;
      stroke: #9cb0c1;
      stroke-width: 1.2;
    }
    .danger {
      fill: #fff0ec;
      stroke: #dca697;
      stroke-width: 1.1;
    }
    .ok {
      fill: #eef9f3;
      stroke: #97c8ae;
      stroke-width: 1.1;
    }
    .info {
      fill: #eef6ff;
      stroke: #9cc1e4;
      stroke-width: 1.1;
    }
  </style>

  <rect x="0" y="0" width="1200" height="920" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="884" rx="30" ry="30" class="panel"/>

  <text x="40" y="56" class="title">Электрическая схема автоматики НБК</text>
  <text x="40" y="80" class="subtitle">Собрано по текущему проекту Smart-Column S3: реальные GPIO из [src/config.h], питание, датчики, силовая часть и исполнительные механизмы</text>

  <rect x="36" y="108" width="284" height="282" rx="22" ry="22" class="panel"/>
  <text x="56" y="136" class="panel-title">Питание и силовая часть</text>

  <rect x="52" y="160" width="110" height="64" rx="16" ry="16" class="box danger"/>
  <text x="70" y="186" class="label">Сеть 220VAC</text>
  <text x="70" y="204" class="small">L / N / PE</text>

  <rect x="182" y="160" width="120" height="64" rx="16" ry="16" class="box danger"/>
  <text x="200" y="186" class="label">Автомат +</text>
  <text x="200" y="204" class="small">предохранитель</text>

  <rect x="52" y="250" width="110" height="70" rx="16" ry="16" class="box info"/>
  <text x="68" y="276" class="label">PZEM-004T</text>
  <text x="68" y="294" class="small">V / A / W / kWh</text>
  <text x="68" y="309" class="tiny">UART1 9600</text>

  <rect x="182" y="250" width="120" height="70" rx="16" ry="16" class="box ok"/>
  <text x="198" y="276" class="label">БП 12V 5A</text>
  <text x="198" y="294" class="small">DR-60-12</text>
  <text x="198" y="309" class="tiny">для клапанов и драйвера</text>

  <rect x="182" y="336" width="120" height="36" rx="12" ry="12" class="chip info"/>
  <text x="198" y="359" class="small">LM2596 → 5.1V логика</text>

  <path d="M162,192 L182,192" class="wire-ac" marker-end="url(#arrow-ac)"/>
  <path d="M107,224 L107,250" class="wire-ac" marker-end="url(#arrow-ac)"/>
  <path d="M242,224 L242,250" class="wire-ac" marker-end="url(#arrow-ac)"/>

  <text x="78" y="346" class="tiny">PE корпуса и ТЭНа — отдельно</text>
  <text x="78" y="362" class="tiny">Ноль сети — общий только по силовой части</text>

  <rect x="360" y="108" width="364" height="520" rx="24" ry="24" class="controller-box"/>
  <text x="384" y="140" class="panel-title controller-text">Контроллер</text>
  <text x="384" y="168" class="controller-text" style="font-size:24px;font-weight:800;">ESP32-S3 DevKitC-1 N16R8</text>
  <text x="384" y="190" class="subtitle" fill="#c9dceb">Прошивка 1.10.4, NBK / Rectification / Distillation</text>

  <rect x="382" y="214" width="320" height="76" rx="16" ry="16" class="chip-dark"/>
  <text x="402" y="238" class="controller-text" style="font-size:12px;font-weight:700;">Питание контроллера</text>
  <text x="402" y="258" class="controller-text" style="font-size:10px;font-weight:600;">5V от LM2596 → VIN / USB-C, затем 3.3V локально на плате</text>
  <text x="402" y="276" class="controller-text" style="font-size:10px;font-weight:600;">Общая GND с ADS1115, TMC2209, MOSFET-модулями и датчиками</text>

  <rect x="384" y="314" width="150" height="280" rx="18" ry="18" class="chip-dark"/>
  <text x="404" y="338" class="controller-text" style="font-size:12px;font-weight:700;">Входы / шины</text>

  <rect x="396" y="352" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="368" class="pin-text">GPIO4  OneWire DS18B20 x7</text>
  <rect x="396" y="382" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="398" class="pin-text">GPIO21 SDA  I2C</text>
  <rect x="396" y="412" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="428" class="pin-text">GPIO9  SCL  I2C</text>
  <rect x="396" y="442" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="458" class="pin-text">GPIO3  YF-S201 flow</text>
  <rect x="396" y="472" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="488" class="pin-text">GPIO1  Level sensor</text>
