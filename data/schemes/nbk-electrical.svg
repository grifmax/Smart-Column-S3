  <text x="406" y="518" class="pin-text">GPIO20 RX ← PZEM TX</text>
  <rect x="396" y="532" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="548" class="pin-text">GPIO19 TX → PZEM RX</text>
  <rect x="396" y="562" width="126" height="24" rx="8" ry="8" class="pin"/>
  <text x="406" y="578" class="pin-text">GPIO38 Buzzer</text>

  <rect x="548" y="314" width="154" height="280" rx="18" ry="18" class="chip-dark"/>
  <text x="568" y="338" class="controller-text" style="font-size:12px;font-weight:700;">Выходы</text>

  <rect x="560" y="352" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="368" class="pin-text">GPIO5  SSR heater</text>
  <rect x="560" y="382" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="398" class="pin-text">GPIO6  STEP pump</text>
  <rect x="560" y="412" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="428" class="pin-text">GPIO7  DIR pump</text>
  <rect x="560" y="442" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="458" class="pin-text">GPIO15 EN pump</text>
  <rect x="560" y="472" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="488" class="pin-text">GPIO16 Valve water</text>
  <rect x="560" y="502" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="518" class="pin-text">GPIO17 Valve heads</text>
  <rect x="560" y="532" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="548" class="pin-text">GPIO18 Valve UNO</text>
  <rect x="560" y="562" width="130" height="24" rx="8" ry="8" class="pin"/>
  <text x="570" y="578" class="pin-text">GPIO8 / 14 optional</text>

  <rect x="382" y="606" width="320" height="18" rx="9" ry="9" fill="rgba(255,255,255,0.10)" stroke="rgba(221,236,247,0.14)" stroke-width="1"/>
  <text x="398" y="619" class="controller-text" style="font-size:10px;font-weight:700;">Примечание: в SPEC указаны старые UART-пины PZEM, в текущем config.h используются GPIO19/20.</text>

  <rect x="760" y="108" width="404" height="224" rx="22" ry="22" class="panel"/>
  <text x="780" y="136" class="panel-title">Нагрев и измерение мощности</text>

  <rect x="782" y="162" width="126" height="64" rx="16" ry="16" class="box danger"/>
  <text x="800" y="188" class="label">PC817</text>
  <text x="800" y="206" class="small">оптроразвязка SSR</text>

  <rect x="932" y="162" width="104" height="64" rx="16" ry="16" class="box danger"/>
  <text x="950" y="188" class="label">SSR-40DA</text>
  <text x="950" y="206" class="small">управление ТЭНом</text>

  <rect x="1054" y="162" width="92" height="64" rx="16" ry="16" class="box danger"/>
  <text x="1070" y="188" class="label">ТЭН</text>
  <text x="1070" y="206" class="small">220VAC</text>

  <path d="M690,364 L782,364 L782,194" class="wire-sig" marker-end="url(#arrow-sig)"/>
