  <path d="M1036,194 L1054,194" class="wire-ac" marker-end="url(#arrow-ac)"/>
  <path d="M302,192 L932,192" class="wire-ac" marker-end="url(#arrow-ac)"/>

  <rect x="782" y="246" width="188" height="58" rx="16" ry="16" class="box info"/>
  <text x="800" y="271" class="label">PZEM-004T v3.0</text>
  <text x="800" y="289" class="small">измеряет V / A / W / f / PF / Energy</text>
  <path d="M162,285 L782,285" class="wire-ac" marker-end="url(#arrow-ac)"/>
  <path d="M522,516 L782,516 L782,275" class="wire-sig" marker-end="url(#arrow-sig)"/>
