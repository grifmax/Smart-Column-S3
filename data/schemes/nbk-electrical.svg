  <rect x="968" y="516" width="152" height="18" rx="8" ry="8" class="chip info"/>
  <text x="980" y="529" class="tiny">На каждом клапане: обратный диод + общая GND</text>

  <rect x="760" y="708" width="404" height="110" rx="22" ry="22" class="panel"/>
  <text x="780" y="736" class="panel-title">Опции</text>
  <rect x="782" y="754" width="160" height="44" rx="14" ry="14" class="soft"/>
  <text x="798" y="773" class="label">MG996R Servo</text>
  <text x="798" y="790" class="small">GPIO8, PWM 50Hz</text>
  <rect x="966" y="754" width="176" height="44" rx="14" ry="14" class="soft"/>
  <text x="982" y="773" class="label">Клапан Start/Stop</text>
  <text x="982" y="790" class="small">GPIO14, ШИМ, 12V NC</text>

  <rect x="36" y="414" width="284" height="404" rx="22" ry="22" class="panel"/>
  <text x="56" y="442" class="panel-title">Датчики и интерфейсы</text>

  <rect x="52" y="466" width="252" height="98" rx="18" ry="18" class="box info"/>
  <text x="70" y="490" class="label">OneWire GPIO4 + подтяжка 4.7 кОм к 3.3V</text>
  <text x="70" y="512" class="small">DS18B20 x7: куб, низ колонны, верх, дефлегматор, ТСА, вода IN, вода OUT</text>
  <text x="70" y="532" class="tiny">Термоконтроль НБК: прогрев, стабилизация, останов помпы при падении T низа</text>
  <text x="70" y="550" class="tiny">Аварии: T ТСА и T воды OUT</text>

  <rect x="52" y="582" width="252" height="116" rx="18" ry="18" class="box info"/>
  <text x="70" y="606" class="label">I2C: GPIO21 SDA / GPIO9 SCL</text>
  <text x="70" y="628" class="small">BMP280 #1 (0x76): атмосферное давление</text>
  <text x="70" y="646" class="small">BMP280 #2 (0x77): резерв / доп. канал</text>
  <text x="70" y="664" class="small">ADS1115 (0x48): A0 ← MPX5010DP</text>
  <text x="70" y="682" class="small">OLED 0x3C: резервный дисплей</text>

  <rect x="52" y="716" width="120" height="84" rx="16" ry="16" class="box info"/>
  <text x="68" y="742" class="label">YF-S201</text>
  <text x="68" y="760" class="small">GPIO3</text>
  <text x="68" y="777" class="tiny">контроль расхода воды</text>

  <rect x="184" y="716" width="120" height="84" rx="16" ry="16" class="box info"/>
  <text x="200" y="742" class="label">Level sensor</text>
  <text x="200" y="760" class="small">GPIO1</text>
  <text x="200" y="777" class="tiny">опция уровня</text>

  <rect x="52" y="812" width="252" height="52" rx="16" ry="16" class="box info"/>
  <text x="70" y="836" class="label">Buzzer GPIO38</text>
  <text x="70" y="854" class="small">предупреждения и аварийная сигнализация</text>

  <rect x="344" y="650" width="380" height="214" rx="22" ry="22" class="panel"/>
