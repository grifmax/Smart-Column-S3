<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка WiFi - Smart-Column S3</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --bg-card: #fff;
            --text: #1d1d1f;
            --text-sec: #6e6e73;
            --accent: #007aff;
            --accent-hover: #0056b3;
            --border: #d2d2d7;
            --success: #34c759;
            --success-bg: #e8f9ed;
            --danger: #ff3b30;
            --danger-bg: #fef0ef;
            --radius: 12px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1e;
                --bg-card: #2c2c2e;
                --text: #f5f5f7;
                --text-sec: #98989d;
                --border: #48484a;
                --success-bg: #0d3b1a;
                --danger-bg: #3b1410;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
        }

        .wizard {
            width: 100%;
            max-width: 440px;
        }

        .wizard-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .wizard-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .wizard-header p {
            color: var(--text-sec);
            font-size: 15px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .card h2 {
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn:hover {
            border-color: var(--accent);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .wifi-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .wifi-status.connected {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .wifi-status.disconnected {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .wifi-status-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .wifi-status-info {
            flex: 1;
        }

        .wifi-status-label {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .wifi-status-details {
            font-size: 0.88em;
            color: var(--text-sec);
        }

        .network-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
        }

        .network-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--bg-card);
        }

        .network-item:hover {
            border-color: var(--accent);
        }

        .network-item.selected {
            border-color: var(--accent);
            border-width: 2px;
        }

        .network-icon {
            font-size: 20px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .network-info {
            flex: 1;
        }

        .network-ssid {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .network-details {
            font-size: 0.84em;
            color: var(--text-sec);
        }

        .signal-strength {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            margin-left: 10px;
        }

        .signal-bar {
            width: 5px;
            border-radius: 2px;
            background: var(--border);
        }

        .signal-bar:nth-child(1) { height: 7px; }
        .signal-bar:nth-child(2) { height: 12px; }
        .signal-bar:nth-child(3) { height: 17px; }
        .signal-bar:nth-child(4) { height: 22px; }

        .signal-bar.active {
            background: var(--success);
        }

        .connect-panel {
            margin-top: 14px;
            padding: 16px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            display: none;
        }

        .connect-panel.show {
            display: block;
        }

        .connect-panel h2 {
            font-size: 16px;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sec);
            margin-bottom: 4px;
        }

        .wifi-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--bg-card);
            color: var(--text);
            transition: border-color 0.2s;
        }

        .wifi-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .wifi-message {
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            font-size: 14px;
        }

        .wifi-message.success {
            display: block;
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .wifi-message.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .skip-link {
            text-align: center;
            margin-top: 16px;
        }

        .skip-link a {
            color: var(--text-sec);
            font-size: 14px;
            text-decoration: none;
        }

        .skip-link a:hover {
            color: var(--accent);
        }

        .redirect-bar {
            text-align: center;
            padding: 14px;
            background: var(--success-bg);
            border: 1px solid var(--success);
            border-radius: var(--radius);
            margin-top: 16px;
            font-size: 15px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="wizard">
        <div class="wizard-header">
            <h1 id="wizard-title">📡 Smart-Column S3</h1>
            <p id="wizard-subtitle">Настройка WiFi</p>
        </div>

        <!-- Статус -->
        <div id="currentStatus"></div>

        <!-- Основная карточка -->
        <div class="card">
            <h2>Доступные сети</h2>

            <div class="controls">
                <button class="btn btn-primary" onclick="scanNetworks()" id="scanBtn">
                    📡 Сканировать
                </button>
            </div>

            <div class="network-list" id="networkList"></div>

            <!-- Форма подключения -->
            <div class="connect-panel" id="connectForm">
                <h2>Подключение</h2>
                <div class="form-group">
                    <label>Сеть:</label>
                    <input type="text" id="selectedSSID" class="wifi-input" readonly>
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="wifiPassword" class="wifi-input" placeholder="Введите пароль"
                        onkeydown="if(event.key==='Enter')connectToNetwork()">
                </div>
                <div class="controls" style="margin-top: 10px;">
                    <button class="btn btn-primary" onclick="connectToNetwork()">
                        🔌 Подключиться
                    </button>
                    <button class="btn" onclick="cancelConnect()">
                        Отмена
                    </button>
                </div>
                <div id="connectMessage" class="wifi-message"></div>
            </div>
        </div>

        <!-- Редирект после подключения -->
        <div class="redirect-bar" id="redirectBar">
            ✅ Подключено! Переход на главную через <span id="countdown">8</span> сек...
        </div>

        <!-- Ссылка "пропустить" (видна только если WiFi уже настроен) -->
        <div class="skip-link" id="skipLink" style="display:none">
            <a href="/">← На главную</a>
        </div>
    </div>

    <script>
        let selectedNetwork = null;
        let isWizardMode = false;

        window.onload = async function () {
            await loadStatus();
            // Авто-сканирование при первом запуске
            scanNetworks();
        };

        async function loadStatus() {
            try {
                const r = await fetch('/api/wifi/status');
                const d = await r.json();
                const el = document.getElementById('currentStatus');
                const skipLink = document.getElementById('skipLink');

                isWizardMode = !d.wifiConfigured;

                if (isWizardMode) {
                    document.getElementById('wizard-subtitle').textContent = 'Первоначальная настройка';
                }

                if (d.wifiConfigured || d.connected) {
                    skipLink.style.display = '';
                }

                if (d.connected) {
                    el.innerHTML = `
                        <div class="wifi-status connected">
                            <div class="wifi-status-icon">✅</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">Подключено: ${d.ssid}</div>
                                <div class="wifi-status-details">IP: ${d.ip} | Сигнал: ${d.rssi} dBm</div>
                            </div>
                        </div>`;
                } else if (d.apMode) {
                    el.innerHTML = `
                        <div class="wifi-status disconnected">
                            <div class="wifi-status-icon">📡</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">Точка доступа: ${d.apSSID}</div>
                                <div class="wifi-status-details">IP: ${d.apIP}</div>
                            </div>
                        </div>`;
                } else {
                    el.innerHTML = `
                        <div class="wifi-status disconnected">
                            <div class="wifi-status-icon">❌</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">WiFi не подключён</div>
                                <div class="wifi-status-details">Выберите сеть из списка</div>
                            </div>
                        </div>`;
                }
            } catch (e) {
                console.error('Status error:', e);
            }
        }

        async function scanNetworks() {
            const btn = document.getElementById('scanBtn');
            const list = document.getElementById('networkList');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Поиск...';
            list.innerHTML = '';

            try {
                const r = await fetch('/api/wifi/scan');
                const d = await r.json();

                if (d.count === 0) {
                    list.innerHTML = '<p style="color:var(--text-sec);text-align:center;padding:20px;">Сети не найдены</p>';
                } else {
                    d.networks.forEach(n => {
                        const s = getSignalStrength(n.rssi);
                        const item = document.createElement('div');
                        item.className = 'network-item';
                        item.onclick = () => selectNetwork(n.ssid, item);
                        item.innerHTML = `
                            <div class="network-icon">${n.encryption === 'open' ? '🔓' : '🔒'}</div>
                            <div class="network-info">
                                <div class="network-ssid">${n.ssid}</div>
                                <div class="network-details">Канал ${n.channel} · ${n.rssi} dBm</div>
                            </div>
                            <div class="signal-strength">${signalBars(s)}</div>`;
                        list.appendChild(item);
                    });
                }
            } catch (e) {
                list.innerHTML = `<p style="color:var(--danger)">Ошибка: ${e.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📡 Сканировать';
            }
        }

        function getSignalStrength(rssi) {
            if (rssi >= -50) return 4;
            if (rssi >= -60) return 3;
            if (rssi >= -70) return 2;
            return 1;
        }

        function signalBars(strength) {
            let b = '';
            for (let i = 1; i <= 4; i++)
                b += `<div class="signal-bar ${i <= strength ? 'active' : ''}"></div>`;
            return b;
        }

        function selectNetwork(ssid, el) {
            document.querySelectorAll('.network-item').forEach(i => i.classList.remove('selected'));
            el.classList.add('selected');
            selectedNetwork = ssid;
            document.getElementById('selectedSSID').value = ssid;
            document.getElementById('wifiPassword').value = '';
            document.getElementById('connectForm').classList.add('show');
            document.getElementById('connectMessage').className = 'wifi-message';
            document.getElementById('wifiPassword').focus();
        }

        function cancelConnect() {
            document.getElementById('connectForm').classList.remove('show');
            document.querySelectorAll('.network-item').forEach(i => i.classList.remove('selected'));
            selectedNetwork = null;
        }

        async function connectToNetwork() {
            const ssid = document.getElementById('selectedSSID').value;
            const password = document.getElementById('wifiPassword').value;
            const msg = document.getElementById('connectMessage');

            if (!ssid) {
                msg.className = 'wifi-message error';
                msg.textContent = 'Выберите сеть';
                return;
            }

            try {
                const r = await fetch('/api/wifi/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, password })
                });
                const d = await r.json();

                if (r.ok) {
                    msg.className = 'wifi-message success';
                    msg.textContent = '✓ Подключение... Ожидайте.';

                    // Проверяем подключение каждые 2 секунды
                    let attempts = 0;
                    const check = setInterval(async () => {
                        attempts++;
                        try {
                            const sr = await fetch('/api/wifi/status');
                            const sd = await sr.json();
                            if (sd.connected) {
                                clearInterval(check);
                                await loadStatus();
                                cancelConnect();
                                startRedirect();
                            }
                        } catch (e) { /* ignore */ }
                        if (attempts >= 10) {
                            clearInterval(check);
                            msg.className = 'wifi-message error';
                            msg.textContent = '✗ Не удалось подключиться. Проверьте пароль.';
                            await loadStatus();
                        }
                    }, 2000);
                } else {
                    msg.className = 'wifi-message error';
                    msg.textContent = '✗ ' + (d.error || 'Ошибка');
                }
            } catch (e) {
                msg.className = 'wifi-message error';
                msg.textContent = '✗ Ошибка: ' + e.message;
            }
        }

        function startRedirect() {
            const bar = document.getElementById('redirectBar');
            const span = document.getElementById('countdown');
            bar.style.display = '';
            let sec = 8;
            const t = setInterval(() => {
                sec--;
                span.textContent = sec;
                if (sec <= 0) {
                    clearInterval(t);
                    window.location.href = '/';
                }
            }, 1000);
        }
    </script>
</body>

</html>
