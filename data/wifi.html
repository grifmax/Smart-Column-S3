<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройка WiFi - Smart-Column S3</title>
    <link rel="stylesheet" href="style.css">
    <script>
        // Загрузить тему из localStorage перед отрисовкой
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* wifi.html — только уникальные компоненты страницы настройки WiFi */

        .wifi-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .wifi-status.connected {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .wifi-status.disconnected {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .wifi-status-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .wifi-status-info {
            flex: 1;
        }

        .wifi-status-label {
            font-weight: 600;
            margin-bottom: 3px;
        }

        .wifi-status.connected .wifi-status-label {
            color: var(--success-text);
        }

        .wifi-status.disconnected .wifi-status-label {
            color: var(--danger-text);
        }

        .wifi-status-details {
            font-size: 0.88em;
            color: var(--text-secondary);
        }

        .network-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
        }

        .network-item {
            display: flex;
            align-items: center;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            background: var(--bg-card);
        }

        .network-item:hover {
            border-color: var(--accent);
            box-shadow: 0 2px 8px var(--shadow);
        }

        .network-item.selected {
            border-color: var(--accent);
            border-width: 2px;
            background: var(--bg-primary);
        }

        .network-icon {
            font-size: 22px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .network-info {
            flex: 1;
        }

        .network-ssid {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .network-details {
            font-size: 0.84em;
            color: var(--text-secondary);
        }

        .signal-strength {
            display: flex;
            gap: 3px;
            align-items: flex-end;
            margin-left: 12px;
        }

        .signal-bar {
            width: 6px;
            border-radius: 2px;
            background: var(--border-color);
        }

        .signal-bar:nth-child(1) {
            height: 8px;
        }

        .signal-bar:nth-child(2) {
            height: 13px;
        }

        .signal-bar:nth-child(3) {
            height: 18px;
        }

        .signal-bar:nth-child(4) {
            height: 23px;
        }

        .signal-bar.active {
            background: var(--success);
        }

        .connect-panel {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .connect-panel.show {
            display: block;
        }

        .connect-panel h2 {
            font-size: 1.1em;
            margin-bottom: 14px;
            color: var(--text-primary);
        }

        .wifi-input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1em;
            background: var(--bg-card);
            color: var(--text-primary);
            transition: border-color 0.25s;
            margin-top: 6px;
        }

        .wifi-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .wifi-message {
            padding: 12px 14px;
            border-radius: 6px;
            margin-top: 12px;
            display: none;
            font-size: 0.95em;
        }

        .wifi-message.success {
            display: block;
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success);
        }

        .wifi-message.error {
            display: block;
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid var(--danger);
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Заголовок -->
        <header>
            <h1>📡 Настройка WiFi</h1>
            <div class="status-bar">
                <a href="/" class="btn btn-sm">← На главную</a>
            </div>
        </header>

        <!-- Основная карточка -->
        <div class="card">
            <h2>Подключение к сети</h2>

            <!-- Текущий статус -->
            <div id="currentStatus"></div>

            <!-- Кнопка сканирования -->
            <div class="controls">
                <button class="btn btn-primary" onclick="scanNetworks()" id="scanBtn">
                    <span>📡</span> Сканировать сети
                </button>
            </div>

            <!-- Список сетей -->
            <div class="network-list" id="networkList"></div>

            <!-- Форма подключения -->
            <div class="connect-panel" id="connectForm">
                <h2>Подключение к сети</h2>
                <div class="form-group">
                    <label>SSID:</label>
                    <input type="text" id="selectedSSID" class="wifi-input" readonly>
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="wifiPassword" class="wifi-input" placeholder="Введите пароль">
                </div>
                <div class="controls" style="margin-top: 10px;">
                    <button class="btn btn-primary" onclick="connectToNetwork()">
                        🔌 Подключиться
                    </button>
                    <button class="btn" onclick="cancelConnect()">
                        Отмена
                    </button>
                </div>
                <div id="connectMessage" class="wifi-message"></div>
            </div>
        </div>

        <footer>
            <p>Smart-Column S3 | WiFi Setup</p>
        </footer>
    </div>

    <script>
        let selectedNetwork = null;

        window.onload = function () {
            loadStatus();
        };

        async function loadStatus() {
            try {
                const response = await fetch('/api/wifi/status');
                const data = await response.json();
                const statusDiv = document.getElementById('currentStatus');

                if (data.connected) {
                    statusDiv.innerHTML = `
                        <div class="wifi-status connected">
                            <div class="wifi-status-icon">✅</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">Подключено к: ${data.ssid}</div>
                                <div class="wifi-status-details">IP: ${data.ip} | Сигнал: ${data.rssi} dBm</div>
                            </div>
                        </div>`;
                } else if (data.apMode) {
                    statusDiv.innerHTML = `
                        <div class="wifi-status disconnected">
                            <div class="wifi-status-icon">📡</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">Режим точки доступа: ${data.apSSID}</div>
                                <div class="wifi-status-details">IP: ${data.apIP}</div>
                            </div>
                        </div>`;
                } else {
                    statusDiv.innerHTML = `
                        <div class="wifi-status disconnected">
                            <div class="wifi-status-icon">❌</div>
                            <div class="wifi-status-info">
                                <div class="wifi-status-label">WiFi не подключён</div>
                                <div class="wifi-status-details">Отсканируйте сети и подключитесь</div>
                            </div>
                        </div>`;
                }
            } catch (error) {
                console.error('Ошибка загрузки статуса:', error);
            }
        }

        async function scanNetworks() {
            const btn = document.getElementById('scanBtn');
            const networkList = document.getElementById('networkList');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Сканирование...';
            networkList.innerHTML = '';

            try {
                const response = await fetch('/api/wifi/scan');
                const data = await response.json();

                if (data.count === 0) {
                    networkList.innerHTML = '<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Сети не найдены</p>';
                } else {
                    data.networks.forEach(network => {
                        const strength = getSignalStrength(network.rssi);
                        const item = document.createElement('div');
                        item.className = 'network-item';
                        item.onclick = () => selectNetwork(network.ssid, item);
                        item.innerHTML = `
                            <div class="network-icon">${network.encryption === 'open' ? '🔓' : '🔒'}</div>
                            <div class="network-info">
                                <div class="network-ssid">${network.ssid}</div>
                                <div class="network-details">Канал: ${network.channel} | ${network.encryption === 'open' ? 'Открытая' : 'Защищённая'}</div>
                            </div>
                            <div class="signal-strength">${generateSignalBars(strength)}</div>`;
                        networkList.appendChild(item);
                    });
                }
            } catch (error) {
                networkList.innerHTML = `<p style="color: var(--danger);">Ошибка сканирования: ${error.message}</p>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>📡</span> Сканировать сети';
            }
        }

        function getSignalStrength(rssi) {
            if (rssi >= -50) return 4;
            if (rssi >= -60) return 3;
            if (rssi >= -70) return 2;
            return 1;
        }

        function generateSignalBars(strength) {
            let bars = '';
            for (let i = 1; i <= 4; i++) {
                bars += `<div class="signal-bar ${i <= strength ? 'active' : ''}"></div>`;
            }
            return bars;
        }

        function selectNetwork(ssid, element) {
            document.querySelectorAll('.network-item').forEach(item => item.classList.remove('selected'));
            element.classList.add('selected');
            selectedNetwork = ssid;
            document.getElementById('selectedSSID').value = ssid;
            document.getElementById('wifiPassword').value = '';
            document.getElementById('connectForm').classList.add('show');
            document.getElementById('connectMessage').className = 'wifi-message';
        }

        function cancelConnect() {
            document.getElementById('connectForm').classList.remove('show');
            document.querySelectorAll('.network-item').forEach(item => item.classList.remove('selected'));
            selectedNetwork = null;
        }

        async function connectToNetwork() {
            const ssid = document.getElementById('selectedSSID').value;
            const password = document.getElementById('wifiPassword').value;
            const messageDiv = document.getElementById('connectMessage');

            if (!ssid) {
                messageDiv.className = 'wifi-message error';
                messageDiv.textContent = 'Выберите сеть';
                return;
            }

            try {
                const response = await fetch('/api/wifi/connect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.className = 'wifi-message success';
                    messageDiv.textContent = '✓ Подключение... Подождите 10 секунд и обновите страницу.';
                    setTimeout(() => { loadStatus(); cancelConnect(); }, 10000);
                } else {
                    messageDiv.className = 'wifi-message error';
                    messageDiv.textContent = '✗ Ошибка: ' + (data.error || 'Неизвестная ошибка');
                }
            } catch (error) {
                messageDiv.className = 'wifi-message error';
                messageDiv.textContent = '✗ Ошибка подключения: ' + error.message;
            }
        }
    </script>
</body>

</html>
